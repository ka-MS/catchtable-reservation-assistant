<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catchtable Reserve</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">CATCHTABLE RESERVE</p>
        <h1>예약 오픈런</h1>
        <p id="status-detail">설정 대기 중</p>
      </div>
      <span id="state" class="state" data-state="IDLE">준비 필요</span>
    </header>

    <div id="countdown" class="countdown" data-mode="countdown" hidden>
      <strong id="countdown-text"></strong>
      <span id="countdown-detail"></span>
    </div>

    <main>
      <form id="reservation-form">
        <fieldset id="config-fields">
          <section class="panel-card">
            <span class="step">01</span>
            <h2>언제 예약할까요?</h2>
            <label class="field wide">
              <span>식당 예약 URL</span>
              <input id="target-url" type="url" required placeholder="https://app.catchtable.co.kr/ct/shop/..." />
            </label>
            <div class="grid two">
              <label class="field">
                <span>예약 오픈 일시</span>
                <input id="open-at" type="datetime-local" required />
              </label>
              <label class="field">
                <span>감시 종료 시각</span>
                <input id="stop-at" type="datetime-local" required />
              </label>
              <label class="field">
                <span>예약 날짜</span>
                <input id="reservation-date" type="date" required />
              </label>
              <label class="field">
                <span>예약 인원</span>
                <input id="person-count" type="number" min="1" max="20" required value="2" />
              </label>
            </div>
          </section>

          <section class="panel-card">
            <span class="step">02</span>
            <h2>어떤 자리를 찾을까요?</h2>
            <div class="grid two">
              <label class="field">
                <span>시작</span>
                <input id="start-time" type="time" required value="18:00" />
              </label>
              <label class="field">
                <span>종료</span>
                <input id="end-time" type="time" required value="20:00" />
              </label>
            </div>
            <div class="priority-editor">
              <label class="field priority-input">
                <span>시간 우선순위</span>
                <span class="inline-control">
                  <input id="priority-time" type="time" />
                  <button id="add-priority" class="icon-button" type="button" title="우선순위 추가" aria-label="우선순위 추가">+</button>
                </span>
              </label>
              <ol id="priority-list" aria-label="시간 우선순위 목록"></ol>
            </div>
          </section>

          <section class="panel-card">
            <span class="step">03</span>
            <h2>어떻게 진행할까요?</h2>
            <label class="toggle-row">
              <input id="post-slot-enabled" type="checkbox" />
              <span>후속 선택 자동 진행</span>
            </label>
            <p class="help">테이블·메뉴 등 실측된 중간 단계를 진행하고 예약 폼에서 멈춥니다. 최종 예약은 확정하지 않습니다.</p>
            <div id="post-slot-options" class="grid two dependent-options" data-enabled="false">
              <label class="field">
                <span>테이블 타입</span>
                <select id="table-preference" disabled>
                  <option value="any">아무거나</option>
                  <option value="hall">홀</option>
                  <option value="bar">바</option>
                  <option value="room">룸</option>
                </select>
              </label>
              <label class="field">
                <span>메뉴명 키워드</span>
                <input id="menu-keyword" type="text" maxlength="80" placeholder="비우면 첫 메뉴" disabled />
              </label>
            </div>
          </section>

          <section class="panel-card execution-card">
            <h2>실행 모드</h2>
            <label class="mode-card">
              <input id="dry-run" type="checkbox" />
              <span>
                <strong>안전 점검</strong>
                <small>슬롯을 감지하지만 클릭하지 않습니다.</small>
              </span>
            </label>
            <label class="field wide">
              <span>예약 페이지 준비</span>
              <select id="entry-mode">
                <option value="auto">자동으로 식당 이동·날짜·인원 준비</option>
                <option value="prepared">현재 준비된 예약 모달 사용</option>
              </select>
            </label>
            <details>
              <summary>고급 설정</summary>
              <div class="grid three advanced-grid">
                <label class="field">
                  <span>사전 시작 (ms)</span>
                  <input id="pre-open-lead" type="number" min="0" max="10000" step="100" value="3000" />
                </label>
                <label class="field">
                  <span>토글 간격 (ms)</span>
                  <input id="toggle-interval" type="number" min="100" max="5000" step="50" value="150" />
                </label>
                <label class="field">
                  <span>시계 표본</span>
                  <input id="clock-samples" type="number" min="3" max="9" step="1" value="9" />
                </label>
              </div>
            </details>
          </section>

          <section class="summary-card" aria-labelledby="summary-title">
            <div>
              <span class="summary-label" id="summary-title">실행 요약</span>
              <strong id="summary-main">예약 정보를 입력해 주세요.</strong>
              <span id="summary-sub">실제 실행 · 후속 선택 안 함</span>
            </div>
          </section>

          <details id="saved-configs" class="panel-card saved-configs">
            <summary>
              <span>최근 설정</span>
              <span id="saved-config-count" class="saved-config-count">0개</span>
            </summary>
            <div class="saved-config-body">
              <div class="saved-config-tabs" role="tablist" aria-label="저장 설정 종류">
                <button type="button" role="tab" data-saved-list="history" aria-selected="true">히스토리</button>
                <button type="button" role="tab" data-saved-list="favorites" aria-selected="false" tabindex="-1">즐겨찾기</button>
              </div>
              <div class="saved-config-actions">
                <button type="button" data-saved-action="save-favorite" hidden>현재 설정 저장</button>
                <button type="button" data-saved-action="clear" disabled>전체 삭제</button>
              </div>
              <ul id="saved-config-list" class="saved-config-list"></ul>
            </div>
          </details>
        </fieldset>
      </form>

      <section class="runtime panel-card">
        <div class="runtime-heading">
          <div>
            <h2>실행 기록</h2>
            <span id="event-count" class="event-count">0개</span>
          </div>
          <div class="runtime-tools">
            <span id="clock-offset">시계 -</span>
            <button id="event-filter" class="filter-button" type="button" aria-pressed="false">중요만</button>
          </div>
        </div>
        <ol id="event-list" class="event-list"></ol>
      </section>
    </main>

    <footer class="action-bar">
      <p id="form-error" class="error" role="alert"></p>
      <button id="start" class="primary" type="submit" form="reservation-form">오픈런 시작</button>
      <button id="stop" class="secondary" type="button" disabled>실행 중지</button>
    </footer>

    <script type="module" src="index.js"></script>
  </body>
</html>
